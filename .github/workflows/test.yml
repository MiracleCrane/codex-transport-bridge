name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protocol fixtures
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'bridge-deps'
          New-Item -ItemType Directory $deps | Out-Null
          Copy-Item runtime/package*.json $deps
          npm --prefix $deps ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
          ./scripts/Test-Offline.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'protocol') -DependencyDirectory (Join-Path $deps 'node_modules')
      - name: Configuration and installation boundaries
        shell: pwsh
        run: |
          python -X utf8 tests/config-edit.test.py --work-directory (Join-Path $env:RUNNER_TEMP 'config-tests')
          if ($LASTEXITCODE -ne 0) { throw 'Config tests failed' }
          ./tests/installer-boundaries.test.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'boundaries')
